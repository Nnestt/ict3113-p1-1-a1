services:
  triage:
    build:
      context: .
      dockerfile: service/Dockerfile
    environment:
      MODEL: ${MODEL:?Set MODEL to a pinned model, e.g. MODEL=qwen2.5:7b docker compose up -d --build}
      OLLAMA_URL: http://host.docker.internal:11434
    ports:
      - "8000:8000"
    volumes:
      - tickets-data:/data
      - ./logs:/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  tickets-data:
